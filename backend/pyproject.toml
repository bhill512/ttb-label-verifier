[project]
name = "ttb-label-verifier"
version = "0.1.0"
description = "Checks alcohol label artwork against application data"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "rapidocr-onnxruntime>=1.4.4,<2",
    "pillow>=10",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
